name: DokuScan
options:
  bundleIdPrefix: de.markus014
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: YES
    DOKUSCAN_UPDATE_URL: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DokuScan:
    type: application
    platform: iOS
    sources:
      - path: DokuScan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.markus014.scanchris
        PRODUCT_NAME: Scanchris
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    info:
      path: DokuScan/Info.plist
      properties:
        CFBundleDisplayName: Scanchris
        CFBundleName: Scanchris
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSCameraUsageDescription: "Scanchris benötigt die Kamera, um Dokumente und Belege zu scannen."
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        DokuScanUpdateURL: "$(DOKUSCAN_UPDATE_URL)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
