name: DokuScan
options:
  bundleIdPrefix: de.dokuscan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: YES
    DOKUSCAN_UPDATE_URL: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DokuScan:
    type: application
    platform: iOS
    sources:
      - path: DokuScan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.example.dokuscan
        PRODUCT_NAME: DokuScan
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DokuScan
        INFOPLIST_KEY_NSCameraUsageDescription: "DokuScan benötigt die Kamera, um Dokumente und Belege zu scannen."
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_DokuScanUpdateURL: "$(DOKUSCAN_UPDATE_URL)"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        SUPPORTS_MACCATALYST: NO
