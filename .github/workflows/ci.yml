name: iOS Buildprüfung
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: SwiftUI für iOS-Simulator kompilieren
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode und XcodeGen vorbereiten
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate --spec project.yml
      - name: Ohne Signierung kompilieren
        run: |
          set -o pipefail
          xcodebuild -project DokuScan.xcodeproj -scheme DokuScan \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
