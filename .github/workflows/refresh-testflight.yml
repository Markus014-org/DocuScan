name: TestFlight – verfügbare Version veröffentlichen
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_BETA_GROUP_ID: ${{ vars.ASC_BETA_GROUP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python-Abhängigkeiten
        run: python -m pip install --disable-pip-version-check 'PyJWT>=2.8,<3' 'cryptography>=42,<50'
      - name: Verfügbare Builds von Apple lesen
        env:
          PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          if [ -z "$ASC_BETA_GROUP_ID" ] || [ -z "$PRIVATE_KEY_B64" ]; then
            echo 'ASC_BETA_GROUP_ID oder ASC_PRIVATE_KEY_BASE64 fehlt'; exit 1
          fi
          export ASC_PRIVATE_KEY="$(printf '%s' "$PRIVATE_KEY_B64" | base64 --decode)"
          python scripts/refresh_testflight_manifest.py site/latest-build.json
      - name: Öffentliche JSON auf GitHub Pages publizieren
        if: ${{ hashFiles('site/latest-build.json') != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          keep_files: true
          enable_jekyll: false
